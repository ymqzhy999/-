<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fffbe6 0%, #ffe0e9 100%);
            min-height: 100vh;
            font-family: 'ZCOOL KuaiLe', '微软雅黑', sans-serif;
        }
        .container {
            margin-top: 40px;
        }
        .card {
            border-radius: 24px;
            box-shadow: 0 8px 32px #ffb19944;
            border: 2px solid #ffe0e9;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(6px);
        }
        .card-header {
            background: linear-gradient(90deg, #ffb199 0%, #ff7e5f 100%);
            color: white;
            border-radius: 24px 24px 0 0;
            font-size: 1.5rem;
            text-align: center;
            padding: 1rem;
        }
        .table thead {
            background: linear-gradient(90deg, #ffb199 0%, #ff7e5f 100%);
            color: white;
        }
        .table tbody tr:hover {
            background: #ffe0e9;
        }
        .btn-primary {
            background: linear-gradient(90deg, #ffb199 0%, #ff7e5f 100%);
            border: none;
            border-radius: 18px;
            padding: 0.5rem 1rem;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 8px #ffb19944;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg, #ff7e5f 0%, #ffb199 100%);
        }
        .btn-warning {
            background: linear-gradient(90deg, #ffb199 0%, #ff7e5f 100%);
            border: none;
            border-radius: 18px;
            padding: 0.5rem 1rem;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 8px #ffb19944;
            transition: background 0.2s;
        }
        .btn-warning:hover {
            background: linear-gradient(90deg, #ff7e5f 0%, #ffb199 100%);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white">用户信息管理</div>
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>姓名</th>
                        <th>账号</th>
                        <th>学院</th>
                        <th>电话</th>
                        <th>邮箱</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user[0] }}</td>
                        <td>{{ user[1] }}</td>
                        <td>{{ user[2] }}</td>
                        <td>{{ user[3] }}</td>
                        <td>{{ user[4] }}</td>
                        <td>{{ user[5] }}</td>
                        <td>
                            <a href="/user/edit/{{ user[0] }}" class="btn btn-primary btn-sm">编辑</a>
                            <a href="/user/{{ user[0] }}/favorites" class="btn btn-warning btn-sm" style="margin-left:5px;">查看收藏</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
