<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>美食可视化系统-首页</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fffbe6 0%, #ffe0e9 100%);
            font-family: 'ZCOOL KuaiLe', '微软雅黑', sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background: rgba(255,255,255,0.95);
            box-shadow: 0 2px 8px #ffb19922;
            margin-bottom: 2rem;
        }
        .navbar-brand {
            font-size: 2rem;
            color: #ff7e5f !important;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            padding: 1rem;
        }
        .module-card {
            border-radius: 18px;
            box-shadow: 0 2px 12px #ffb19922;
            background: #fff;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,126,95,0.1);
        }
        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px #ffb19944;
            border-color: rgba(255,126,95,0.3);
        }
        .module-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #ff7e5f;
        }
        .module-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ff7e5f;
            margin-bottom: 0.5rem;
        }
        .module-desc {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        .page-header {
            text-align: center;
            margin: 2rem 0;
            color: #ff7e5f;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255,126,95,0.1);
        }
        .shop-marquee-bottom {
            width: 100%;
            max-width: 1600px;
            margin: 48px auto 0 auto;
            height: 90px;
            background: rgba(255,255,255,0.88);
            border-radius: 16px;
            box-shadow: 0 2px 8px #ffb19922;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            border: 1.5px solid #ffe0e9;
            position: relative;
            padding: 10px 0;
        }
        .shop-marquee-row {
            width: 100%;
            height: 28px;
            overflow: hidden;
            position: relative;
            margin-bottom: 4px;
        }
        .shop-marquee-track {
            display: flex;
            align-items: center;
            white-space: nowrap;
            will-change: transform;
        }
        .shop-marquee-bottom a {
            display: inline-block;
            color: #ff7e5f;
            font-weight: bold;
            margin: 0 32px;
            text-decoration: none;
            font-size: 17px;
            line-height: 1.6;
            transition: color 0.2s;
            padding: 2px 8px;
            border-radius: 6px;
        }
        .shop-marquee-bottom a:hover { color: #ff4e50; background: #fffbe6; }
        @media (max-width: 900px) {
            .shop-marquee-bottom { display: none; }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
        <a class="navbar-brand" href="/">🍰 美食可视化系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/recommendations">美食店铺查询</a></li>
                <li class="nav-item"><a class="nav-link" href="/html/welcome">个人信息</a></li>
                <li class="nav-item"><a class="nav-link" href="/user/profile">账户信息</a></li>
                <li class="nav-item"><a class="nav-link" href="/user/list">用户管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/user/{{ user_id }}/favorites">我的收藏</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">退出登录</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="page-header">美食数据可视化平台</h1>
    
    <div class="shop-marquee-bottom" id="shopMarqueeBottom">
        <div class="shop-marquee-track" id="shopMarqueeTrack"></div>
    </div>
    
    <div class="module-grid">
        <a href="/recommendations" class="module-card">
            <div class="module-icon">🔍</div>
            <div class="module-title">美食店铺查询</div>
            <div class="module-desc">输入关键词和价格区间，智能查找美食店铺</div>
        </a>
        
        <a href="/page" class="module-card">
            <div class="module-icon">📊</div>
            <div class="module-title">数据大屏</div>
            <div class="module-desc">可视化展示美食数据，洞察消费趋势</div>
        </a>
        
        <a href="/店铺有无优惠占比" class="module-card">
            <div class="module-icon">🎁</div>
            <div class="module-title">店铺优惠占比</div>
            <div class="module-desc">分析店铺优惠情况，了解市场促销趋势</div>
        </a>
        
        <a href="/美食排行榜前20" class="module-card">
            <div class="module-icon">🏆</div>
            <div class="module-title">美食排行榜</div>
            <div class="module-desc">查看最受欢迎的美食店铺TOP20</div>
        </a>
        
        <a href="/推荐菜品词云图" class="module-card">
            <div class="module-icon">☁️</div>
            <div class="module-title">推荐菜品词云</div>
            <div class="module-desc">直观展示热门推荐菜品关键词</div>
        </a>
        
        <a href="/平均消费价格区间柱状图" class="module-card">
            <div class="module-icon">💰</div>
            <div class="module-title">价格区间分析</div>
            <div class="module-desc">了解不同价格区间的店铺分布</div>
        </a>
        
        <a href="/店铺类型占比饼图" class="module-card">
            <div class="module-icon">🍽️</div>
            <div class="module-title">店铺类型占比</div>
            <div class="module-desc">分析各类美食店铺的市场占比</div>
        </a>
        
        <a href="/美食店铺评论人数top10" class="module-card">
            <div class="module-icon">💬</div>
            <div class="module-title">评论人数TOP10</div>
            <div class="module-desc">查看最受关注的美食店铺</div>
        </a>
        

    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
<script>
function startMarquee(id, shops, direction = 'down') {
    const box = document.getElementById(id);
    let idx = 0;
    function render() {
        box.innerHTML = '';
        for (let i = 0; i < 6; i++) {
            let shop = shops[(idx + i) % shops.length];
            let a = document.createElement('a');
            a.href = '/food/' + shop.id;
            a.textContent = shop.title;
            box.appendChild(a);
        }
        idx = (idx + 1) % shops.length;
    }
    render();
    setInterval(render, 1800);
}

fetch('/api/all_shops')
    .then(res => res.json())
    .then(shops => {
        if (shops.length > 0) {
            const track = document.getElementById('shopMarqueeTrack');
            if (track) {
                // 拼接两遍内容
                let html = '';
                shops.forEach(shop => {
                    html += `<a href="/food/${shop.id}">${shop.title}</a>`;
                });
                // 再拼一遍
                html += html;
                track.innerHTML = html;

                // 计算原始内容宽度
                const firstRoundWidth = track.scrollWidth / 2;

                let position = 0;
                const speed = 1; // px/帧

                function animate() {
                    position -= speed;
                    // 到达一轮内容宽度后重置
                    if (Math.abs(position) >= firstRoundWidth) {
                        position = 0;
                    }
                    track.style.transform = `translateX(${position}px)`;
                    requestAnimationFrame(animate);
                }

                animate();
            }
        }
    });
</script>
</body>
</html>
